<style>
  :root{
    --ink:#1B2A41;
    --parchment:#F5EFE2;
    --parchment-dark:#EAE1CC;
    --maroon:#7A2E2E;
    --gold:#A8863C;
    --green:#3F5B45;
    --charcoal:#2B2B2B;
    --line:#C9BC9C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(168,134,60,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(27,42,65,0.05), transparent 40%);
    color:var(--charcoal);
    font-family:'Source Serif 4', 'Noto Serif Devanagari', serif;
    min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto; padding:48px 20px 80px;}

  header{text-align:left; margin-bottom:36px; border-bottom:2px solid var(--ink); padding-bottom:20px;}
  .seal-row{display:flex; align-items:center; gap:18px; margin-bottom:10px;}
  .avatar{
    width:80px; height:100px; flex-shrink:0;
    object-fit:cover;
    object-position:center top;
    border:2px solid var(--gold);
  }
  h1{
    font-family:'Noto Serif Devanagari', serif;
    font-size:1.9rem; font-weight:700; color:var(--ink); margin:0;
    letter-spacing:0.01em;
    line-height:1.15;
  }
  .sub{font-size:0.98rem; color:#5a5548; margin-top:6px; line-height:1.5; max-width:60ch;}

  .disclaimer{
    background:var(--parchment-dark);
    border-left:3px solid var(--maroon);
    padding:14px 18px;
    font-size:0.88rem;
    line-height:1.6;
    color:var(--charcoal);
    margin-bottom:34px;
  }
  .disclaimer b{color:var(--maroon);}

  .case-file{
    background:#FFFDF8;
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 8px 24px rgba(27,42,65,0.06);
    padding:28px;
  }
  label{
    display:block; font-size:0.95rem; font-weight:600; color:var(--ink);
    margin-bottom:8px;
  }
  textarea{
    width:100%; min-height:150px; resize:vertical;
    font-family:'Source Serif 4','Noto Serif Devanagari',serif;
    font-size:1rem; line-height:1.6;
    padding:14px; padding-right:52px; border:1px solid var(--line); background:var(--parchment);
    color:var(--charcoal);
  }
  .textarea-wrap{position:relative;}
  .mic-btn{
    position:absolute; top:10px; right:10px;
    width:34px; height:34px;
    border:1px solid var(--gold);
    background:#FFFDF8;
    color:var(--maroon);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    transition:background 0.15s ease, transform 0.1s ease;
    padding:0;
  }
  .mic-btn:hover{background:var(--parchment-dark);}
  .mic-btn svg{width:17px; height:17px; fill:var(--maroon);}
  .mic-btn.listening{
    background:var(--maroon);
    animation:pulse 1.2s ease-in-out infinite;
  }
  .mic-btn.listening svg{fill:#FFFDF8;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(122,46,46,0.4);}
    70%{box-shadow:0 0 0 10px rgba(122,46,46,0);}
    100%{box-shadow:0 0 0 0 rgba(122,46,46,0);}
  }
  .mic-hint{
    font-size:0.78rem; color:#9a9587; margin-top:6px; font-style:italic;
  }
  textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .meta-row{display:flex; gap:12px; margin-top:14px; flex-wrap:wrap;}
  select{
    flex:1; min-width:160px;
    font-family:inherit; font-size:0.92rem;
    padding:10px 12px; border:1px solid var(--line); background:var(--parchment);
    color:var(--charcoal);
  }

  .submit-btn{
    margin-top:20px;
    width:100%;
    background:var(--ink);
    color:var(--parchment);
    border:none;
    padding:15px 20px;
    font-family:'Noto Serif Devanagari', serif;
    font-size:1.05rem; font-weight:600;
    cursor:pointer;
    letter-spacing:0.01em;
    transition:background 0.15s ease;
  }
  .submit-btn:hover:not(:disabled){background:#0f1b2d;}
  .submit-btn:disabled{background:#9a9587; cursor:not-allowed;}

  .status{
    margin-top:18px; font-size:0.9rem; color:var(--gold); display:none;
    font-style:italic;
  }
  .status.active{display:block;}
  .status .dots::after{
    content:'';
    animation:dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }

  .error-box{
    margin-top:18px; padding:14px 16px;
    background:#FBEAEA; border-left:3px solid var(--maroon);
    color:var(--maroon); font-size:0.9rem; display:none;
  }
  .error-box.active{display:block;}

  .report{display:none; margin-top:36px;}
  .report.active{display:block;}
  .report-header{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:22px;
  }
  .report-header h2{
    font-family:'Noto Serif Devanagari', serif; font-size:1.3rem; color:var(--ink); margin:0;
  }
  .report-header span{font-size:0.82rem; color:#8a8474;}

  .verdict-strip{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px; margin-bottom:28px;
    border:1px solid var(--line);
  }
  .verdict-strip.strong{border-left:5px solid var(--green);}
  .verdict-strip.weak{border-left:5px solid var(--maroon);}
  .verdict-strip.moderate{border-left:5px solid var(--gold);}
  .verdict-label{
    font-family:'Noto Serif Devanagari', serif; font-weight:700; font-size:1.05rem;
  }
  .verdict-strip.strong .verdict-label{color:var(--green);}
  .verdict-strip.weak .verdict-label{color:var(--maroon);}
  .verdict-strip.moderate .verdict-label{color:var(--gold);}

  .section{margin-bottom:26px;}
  .section h3{
    font-family:'Noto Serif Devanagari', serif;
    font-size:1.05rem; color:var(--ink);
    margin:0 0 10px 0;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .section .content{font-size:0.97rem; line-height:1.75; color:var(--charcoal);}
  .section .content p{margin:0 0 10px 0;}
  .section .content ul{margin:6px 0; padding-left:22px;}
  .section .content li{margin-bottom:6px;}
  .section.strengths h3{color:var(--green);}
  .section.weaknesses h3{color:var(--maroon);}

  .sources{
    font-size:0.82rem; color:#8a8474; margin-top:6px; line-height:1.6;
  }
  .sources a{color:var(--gold);}

  footer.note{
    margin-top:40px; text-align:center; font-size:0.8rem; color:#9a9587;
    border-top:1px solid var(--line); padding-top:18px;
  }
</style>
